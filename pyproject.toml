[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubwik"
version = "0.1.0"
description = "Open household-growing records and a compiler for HubWīk cite-faces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shiven" }]
keywords = ["agripedia", "growing", "json-ld", "howto"]

[project.scripts]
hubwik = "hubwik.cli:main"

[project.urls]
Homepage = "https://github.com/the-homestead-hub/hubwik"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
