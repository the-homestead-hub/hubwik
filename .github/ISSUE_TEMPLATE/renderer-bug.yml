name: Renderer bug
description: The compiler, preview HTML, JSON-LD, or Shopify snippets are wrong.
title: "[renderer] "
labels: ["renderer"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: PYTHONPATH=src python3 -m hubwik build
  - type: textarea
    id: notes
    attributes:
      label: Page or snippet
      placeholder: grow-dill.html, thh-hubwik-body.liquid, cite_set.json
