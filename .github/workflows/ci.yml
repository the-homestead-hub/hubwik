name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Check
        run: PYTHONPATH=src python3 -m hubwik check
      - name: Build
        run: PYTHONPATH=src python3 -m hubwik build
