name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Check
        run: PYTHONPATH=src python3 -m hubwik check
      - name: Build
        run: PYTHONPATH=src python3 -m hubwik build
