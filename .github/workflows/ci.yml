name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Check
        run: PYTHONPATH=src python3 -m hubwik check
      - name: Build
        run: PYTHONPATH=src python3 -m hubwik build
